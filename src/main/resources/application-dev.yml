server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/marvisareparto
    username: postgres
    password: 1234567
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: 1234567890123456789012345678901234567890123456789012345678901234
  expiration-ms: 86400000

logging:
  level:
    org.springframework.security: INFO